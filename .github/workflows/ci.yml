name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build daemon
        run: npm run build:cli
      - name: Build web app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentinel:ci .
      - name: Smoke test container
        run: |
          docker run -d --name sentinel \
            -e WALLET_ADDRESS=0x70997970C51812dc3A010C7d01b50e0d17dc79C8 \
            -e DRY_RUN=true \
            -p 3000:3000 -p 8545:8545 \
            sentinel:ci
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8545/healthz > /dev/null && curl -fsS http://127.0.0.1:3000/api/metrics > /dev/null; then ok=1; break; fi
            sleep 3
          done
          docker logs sentinel
          [ "$ok" = "1" ] || { echo "container did not become healthy"; exit 1; }
          test "$(docker inspect -f '{{.State.Running}}' sentinel)" = "true"
          # settings were seeded into the data volume and the process runs as non-root
          docker exec sentinel test -f /app/data/settings.json
          test "$(docker exec sentinel id -u)" != "0"
      - name: Stop container
        if: always()
        run: docker rm -f sentinel || true
