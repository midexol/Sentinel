services:
  # ============================================================================
  # Sentinel All-In-One Service
  # Web dashboard (3000) plus the watchdog + RPC proxy daemon (8545) in one
  # container. The proxy is published on the host loopback only; put your bot
  # on the same host, or set PROXY_AUTH_TOKEN before exposing it further.
  # Usage: docker compose up -d
  # ============================================================================
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel:latest
    container_name: sentinel
    restart: unless-stopped
    command: ["all"]
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "127.0.0.1:8545:8545"
    volumes:
      # log, state file and editable settings.json all live here
      - sentinel-data:/app/data

  # ============================================================================
  # Split profile: run the daemon and the dashboard separately. Both mount the
  # same volume so they share the audit log and state file.
  # Usage: docker compose --profile split up sentinel-daemon sentinel-web -d
  # ============================================================================
  sentinel-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel:latest
    container_name: sentinel-daemon
    restart: unless-stopped
    command: ["daemon"]
    env_file:
      - .env
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - sentinel-data:/app/data
    profiles:
      - split

  sentinel-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel:latest
    container_name: sentinel-web
    restart: unless-stopped
    command: ["app"]
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - sentinel-data:/app/data
    profiles:
      - split

volumes:
  sentinel-data:
    driver: local
